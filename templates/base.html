<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Arena RPG{% endblock %}</title>
  <style>
    body { font-family: Georgia, serif; background: #1b1a2e; color: #eee; margin: 0; }
    header { background: #2d2b55; padding: 14px 24px; font-size: 1.4rem; letter-spacing: 2px; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .cols { display: flex; gap: 16px; flex-wrap: wrap; }
    .card { background: #28264a; border-radius: 8px; padding: 14px 18px; flex: 1; min-width: 240px; }
    h2 { margin: 24px 0 8px; } .card h2 { margin-top: 0; }
    label { display: block; margin: 8px 0 2px; font-size: .9rem; }
    input { width: 100%; padding: 6px; box-sizing: border-box; border-radius: 4px; border: 1px solid #666; }
    button { margin-top: 16px; padding: 10px 22px; font-size: 1rem; background: #e8b730; border: 0; border-radius: 6px; cursor: pointer; }
    .error { background: #7a1f2b; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 6px 8px; border-bottom: 1px solid #444; text-align: left; }
    tr.CRITICO td { color: #ffd34d; font-weight: bold; }
    tr.FALLO td { color: #999; }
    .barra { display: flex; height: 26px; border-radius: 6px; overflow: hidden; margin: 8px 0; }
    .barra div { text-align: center; font-size: .85rem; line-height: 26px; color: #111; }
    .b1 { background: #6fcf97; } .b2 { background: #eb5757; } .bE { background: #bbb; }
    a { color: #e8b730; }
  </style>
</head>
<body>
  <header>&#9856; ARENA RPG</header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
